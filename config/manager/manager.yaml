apiVersion: v1
kind: Namespace
metadata:
  name: npmk-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: npmk-operator-controller-manager
  namespace: npmk-operator-system
  labels:
    control-plane: controller-manager
    app: npmk-operator
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app: npmk-operator
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: controller-manager
        app: npmk-operator
    spec:
      serviceAccountName: npmk-operator-controller-manager
      containers:
      - name: manager
        image: controller:latest
        imagePullPolicy: Always
        command:
        - /manager
        args:
        - --leader-elect
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
